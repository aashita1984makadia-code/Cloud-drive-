<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared file · CloudDrive</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="share-page"><div class="brand">☁️ CloudDrive</div><section class="panel"><h1 id="name">Shared file</h1><p id="meta"></p><a id="download" class="btn primary">Download</a></section></main><script>const t=location.pathname.split("/").pop();fetch("/share/"+t+"/meta").then(r=>r.json()).then(x=>{if(!x.success)throw 0;name.textContent=x.data.name;meta.textContent=x.data.mimeType+" · "+(x.data.size/1048576).toFixed(2)+" MB";download.href="/share/"+t+"/download";download.style.display=x.data.allowDownload?"inline-flex":"none"}).catch(()=>document.querySelector(".panel").innerHTML="<h1>Share unavailable</h1><p>This link is expired or invalid.</p>");</script></body></html>
