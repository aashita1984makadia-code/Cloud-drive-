<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · CloudDrive</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="auth"><form id="form" class="panel"><div class="brand">☁️ CloudDrive</div><h1>Welcome back</h1><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn primary">Sign in</button><p id="msg"></p><a href="/register.html">Create account</a></form></div><script>form.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form)))});let x=await r.json();if(x.success)location="/";else msg.textContent=x.message}</script></body></html>
